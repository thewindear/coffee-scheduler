[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffee-scheduler-worker"
version = "0.1.0"
description = "Async HTTP client and Worker runtime for Coffee Scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["coffee_scheduler_worker"]
